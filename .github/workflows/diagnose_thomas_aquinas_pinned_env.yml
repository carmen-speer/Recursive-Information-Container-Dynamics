name: Diagnose Thomas Aquinas - Pinned Environment

# Runs ONE evaluation of Thomas Aquinas College at real production
# settings (cores=1, same as score_batch.py), inside the exact
# pinned-environment image built by build_thomas_aquinas_pinned_image.yml.
# Deliberately a single evaluation per dispatch, not several replicates
# in one run -- random_seed=7 is fixed in score_institution.py and
# cannot vary, so replicates inside one job would agree with each other
# no matter what. The real test is dispatching THIS workflow several
# separate times and comparing the CONVERGENCE / frac_high_entropy
# lines each separate run's log prints.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/carmen-speer/recursive-information-container-dynamics-thomas-aquinas-pinned:latest
    steps:
      - name: Run Thomas Aquinas pinned-environment diagnostic
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
        run: |
          cd /app/src
          python diagnose_thomas_aquinas_pinned_env.py
