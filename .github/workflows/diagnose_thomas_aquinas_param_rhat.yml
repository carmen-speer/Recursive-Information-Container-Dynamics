name: Diagnose Thomas Aquinas College (per-parameter rhat breakdown)

# Item 6 of the Thomas Aquinas investigation's own stated plan:
# identifies which specific free parameter(s) are driving the persistent
# rhat>1.01 failure, using debug_param_rhat=True (2026-09-23, added to
# score_institution.py's compute_features_for_institution specifically
# for this). See diagnose_thomas_aquinas_param_rhat.py's own docstring
# for the full reasoning, and the README's Known Gaps section for why
# this matters (the same kind of fix already worked once for a
# different parameter -- z_raw/xi_scale's funnel).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cd src && python diagnose_thomas_aquinas_param_rhat.py
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
