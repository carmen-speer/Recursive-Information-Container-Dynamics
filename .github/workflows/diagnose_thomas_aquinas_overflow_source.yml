name: Diagnose Thomas Aquinas overflow source (varied seeds)

# Item 7: identifies exactly which of the 10 varied seeds (see
# diagnose_thomas_aquinas_varied_seed.py) trigger PyMC's "overflow
# encountered in dot" RuntimeWarning -- 3/10 did on the original run,
# documented in the README as a real residual, not yet investigated
# further. This run captures the warning directly, per seed, instead of
# just noting it appeared. See diagnose_thomas_aquinas_overflow_source.py's
# own docstring for the full reasoning.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cd src && python diagnose_thomas_aquinas_overflow_source.py
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
